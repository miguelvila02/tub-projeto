# Recolha diária do feed GTFS-Realtime dos TUB, nos servidores do GitHub.
#
# Corre nos dias úteis de manhã e guarda os dados como "artefacto" da
# execução (fica disponível 90 dias). Para os descarregar para o computador:
#     bash scripts/descarregar_dados.sh
#
# Janelas de recolha (hora de Lisboa): 06:30-10:30 e 16:30-19:30, todos os dias
# (dias úteis, fins de semana e feriados).
# O cron do GitHub está em UTC; em Lisboa, no inverno, UTC = hora local.
# Cada execução espera que a janela abra (até 60 min), recolhe até ao fim
# dessa janela e termina.
#
# O GitHub às vezes atrasa ou salta agendamentos quando está sobrecarregado.
# Por isso há quatro disparos por janela: se um falhar, o seguinte arranca.
# A regra de "concurrency" põe os disparos extra em fila; quando chega a vez
# deles a janela já fechou e terminam logo, sem recolher nada em duplicado.

name: Recolha GTFS-RT

on:
  schedule:
    - cron: "45 5 * * *"
    - cron: "15 6 * * *"
    - cron: "45 6 * * *"
    - cron: "15 7 * * *"
    # fim de tarde
    - cron: "45 15 * * *"
    - cron: "15 16 * * *"
    - cron: "45 16 * * *"
    - cron: "15 17 * * *"
  workflow_dispatch:        # permite lançar à mão no separador "Actions"
    inputs:
      teste:
        description: "Só um pedido a cada feed (para testar)"
        type: boolean
        default: true

concurrency:
  group: recolha-gtfs-rt
  cancel-in-progress: false

jobs:
  recolha:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install gtfs-realtime-bindings pandas

      - name: Data de hoje (Lisboa)
        id: data
        run: echo "hoje=$(TZ=Europe/Lisbon date +%F)" >> "$GITHUB_OUTPUT"

      - name: Recolher
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.teste }}" = "true" ]; then
            python src/recolha_rt.py --uma-vez
          else
            python src/recolha_rt.py --sair-no-fim --fins-de-semana
          fi

      - name: Meteorologia (Open-Meteo)
        if: always()
        continue-on-error: true   # nunca deixa falhar a recolha dos TUB
        run: |
          python src/meteo.py --dias 3 \
            --saida "dados/gtfs_rt/brutos/meteo/meteo_${{ steps.data.outputs.hoje }}_${{ github.run_id }}.csv"

      - name: Guardar os dados como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gtfs-rt-${{ steps.data.outputs.hoje }}-${{ github.run_id }}
          path: dados/gtfs_rt/brutos/
          retention-days: 90
          if-no-files-found: warn